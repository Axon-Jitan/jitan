name: terminal
description: Jitan Terminal, the shared tablet where employees scan in and out.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  jitan_api_client:
    path: ../../packages/jitan_api_client
  jitan_core:
    path: ../../packages/jitan_core
  jitan_models:
    path: ../../packages/jitan_models
  jitan_ui:
    path: ../../packages/jitan_ui
  logging: ^1.3.0
  mobile_scanner: ^7.4.2
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
